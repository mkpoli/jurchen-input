# Rime schema
# encoding: utf-8

schema:
  schema_id: Alari_jurc
  name: "Alari Jurchen"
  version: "2026.05.28"
  author:
    - Yehenara Ayasala
  description: |
    女真文 Unicode 单字输入方案
    H = 𙆠
    S = 𙆰
    P = 𙆿
    D = 𙇐
    Z = 𙆡
    B = 

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor

  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor

  translators:
    - table_translator

  filters:
    - uniquifier
    - single_char_filter

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  initials: hspdzb
  delimiter: " ;'"

translator:
  dictionary: Alari_jurc
  enable_charset_filter: false
  enable_sentence: false
  enable_encoder: false
  preedit_format:
    - xform/^([a-z]*)$/$1｜\U$1\E/
    - "xlit|HSPDZB|𙆠𙆰𙆿𙇐𙆡|"
  comment_format:
    - "xlit|hspdzb~|𙆠𙆰𙆿𙇐𙆡～|"

style:
  font_face: "Alari Xuwasun Jurchen, Microsoft YaHei"
  comment_font_face: "Alari Xuwasun Jurchen, Microsoft YaHei"
  font_point: 22
  comment_font_point: 22